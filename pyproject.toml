[project]
name = "retail-sales-report-demo"
version = "0.1.0"
description = "Reproducible sales analysis report on the UCI Online Retail II dataset (demo)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "matplotlib>=3.9",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "jupyter>=1.1", "nbconvert>=7", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
